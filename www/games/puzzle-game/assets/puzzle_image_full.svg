<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Bright sunny outdoor scene: smiling sun, blue sky, green grass, two children and a colorful ball -->
  <rect width="100%" height="100%" fill="#a6e0ff" />
  <!-- sun -->
  <g transform="translate(680,80)">
    <circle cx="0" cy="0" r="64" fill="#ffd54a" stroke="#ffb300" stroke-width="6" />
    <circle cx="-12" cy="-12" r="6" fill="#fff" />
    <g transform="translate(-10,22)">
      <circle cx="-6" cy="-6" r="4" fill="#ffb300" />
    </g>
  </g>
  <!-- clouds -->
  <g fill="#ffffffcc" transform="translate(120,80)">
    <ellipse cx="0" cy="0" rx="42" ry="26" />
    <ellipse cx="36" cy="-6" rx="48" ry="30" />
  </g>
  <!-- grass -->
  <rect x="0" y="560" width="800" height="240" fill="#7ed957" />
  <!-- daisies -->
  <g transform="translate(120,630)">
    <circle cx="0" cy="0" r="8" fill="#fff" />
    <circle cx="0" cy="0" r="6" fill="#ffd54a" />
  </g>
  <g transform="translate(220,700)">
    <circle cx="0" cy="0" r="8" fill="#fff" />
    <circle cx="0" cy="0" r="6" fill="#ffd54a" />
  </g>
  <!-- children: simple shapes cartoon-style -->
  <!-- boy (left) -->
  <g transform="translate(220,480)">
    <circle cx="0" cy="-40" r="36" fill="#ffdbb4" stroke="#000" stroke-width="2" />
    <rect x="-36" y="-4" width="72" height="80" rx="12" fill="#4fc3f7" stroke="#000" stroke-width="2" />
    <!-- smile -->
    <path d="M -14 -30 q 14 18 28 0" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- eyes -->
    <circle cx="-12" cy="-46" r="4" fill="#000" />
    <circle cx="12" cy="-46" r="4" fill="#000" />
  </g>
  <!-- girl (right) -->
  <g transform="translate(420,490)">
    <circle cx="0" cy="-42" r="36" fill="#ffdbb4" stroke="#000" stroke-width="2" />
    <rect x="-36" y="-6" width="72" height="86" rx="14" fill="#ffd88a" stroke="#000" stroke-width="2" />
    <!-- hair simple -->
    <path d="M -30 -60 q 30 -36 60 0" fill="#6b3e26" />
    <path d="M -30 -60 q 30 10 60 0" fill="#5a2f19" />
    <!-- smile -->
    <path d="M -14 -30 q 14 18 28 0" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- eyes -->
    <circle cx="-12" cy="-46" r="4" fill="#000" />
    <circle cx="12" cy="-46" r="4" fill="#000" />
  </g>
  <!-- big colorful ball between them -->
  <g transform="translate(340,540)">
    <circle cx="0" cy="0" r="54" fill="#ff7f7f" stroke="#c94b4b" stroke-width="4" />
    <path d="M -54 0 a 54 54 0 0 1 108 0" fill="#ffd54a" opacity="0.9" />
    <circle cx="-16" cy="-18" r="12" fill="#4fc3f7" />
  </g>
</svg>
